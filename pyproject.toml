[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-simulator"
version = "0.1.0"
description = "Monte Carlo simulation for probabilistic project cost and schedule risk analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Monte Carlo Simulator Team" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5.7",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "jupyter>=1.0",
]
ui = [
  "plotly>=5.22",
  "streamlit>=1.36",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
ignore_missing_imports = true

[tool.coverage.run]
omit = [
  "src/monte_carlo_simulator/analysis/sensitivity.py",
  "src/monte_carlo_simulator/analysis/value_at_risk.py",
  "src/monte_carlo_simulator/engine/aggregation.py",
  "src/monte_carlo_simulator/engine/convergence.py",
  "src/monte_carlo_simulator/visualization/s_curve.py",
  "src/monte_carlo_simulator/visualization/tornado.py",
]
