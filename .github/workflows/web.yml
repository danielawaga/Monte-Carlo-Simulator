name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install web API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      - name: Import FastAPI adapter
        run: python -c "from monte_carlo_simulator.web_api import app; assert app.title"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Type-check and build frontend
        working-directory: web
        run: npm run build
